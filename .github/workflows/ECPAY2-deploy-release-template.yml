name: ECPAY2 Deploy to Production EC2 via Bastion

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
    secrets:
      ECPAY2_BASTION_HOST:
        required: true
      ECPAY2_BASTION_USER:
        required: true
      ECPAY2_BASTION_SSH_KEY:
        required: true

jobs:
  prod-env-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- Paso 1: Contexto
      - name: Print context info
        run: |
          echo "Repo: ${{ github.event.repository.name }}"
          echo "Branch (ref): ${{ github.ref_name }}"
          echo "Branch (input): ${{ inputs.branch }}"
          echo "Commit: ${{ github.sha }}"

      # --- Paso 2: Llave SSH del bastión
      - name: Set up Bastion SSH key
        run: |
          echo "${{ secrets.ECPAY2_BASTION_SSH_KEY }}" > bastion_key.pem
          chmod 600 bastion_key.pem

      # --- Paso 3: Deploy vía bastión usando connect-to-ecpay
      - name: Deploy to Production via Bastion
        timeout-minutes: 2
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
        run: |
          echo "==> Rama seleccionada: $BRANCH_NAME"
          ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=2 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -i bastion_key.pem \
              ${{ secrets.ECPAY2_BASTION_USER }}@${{ secrets.ECPAY2_BASTION_HOST }} << EOF

            set -e
            echo "==> Conectado al Bastión"

            echo "==> Conectando a EC2 Productivo..."
            bash /home/ec2-user/ecpay/conexion_ec2_ecpay.sh

            echo "==> Conectado exitosamente a EC2 Productivo"

            cd ~/ecpay/ECPAY2_RD/${REPO_NAME}

            echo "==> Actualizando código desde Git..."
            git fetch origin
            git reset --hard
            git clean -fd -e .env -e .env.*            
            git checkout ${BRANCH_NAME}            
            git reset --hard origin/${BRANCH_NAME}

            echo "==> Permisos al script de despliegue..."
            sudo chmod +x tool_deploy.sh

            echo "==> Ejecutando tool_deploy.sh..."
            ./tool_deploy.sh

            echo "==> Despliegue a PRODUCCIÓN completado exitosamente"
          EOF

      # --- Paso 4: Limpieza
      - name: Clean up SSH key
        if: always()
        run: rm -f bastion_key.pem
