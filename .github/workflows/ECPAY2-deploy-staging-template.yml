name: ECPAY2 Deploy to Staging EC2

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
    secrets:
      ECPAY2_EC2_TEST_HOST:
        required: true
      ECPAY2_EC2_TEST_USER:
        required: true
      ECPAY2_EC2_TEST_SSH_KEY:
        required: true

jobs:
  test-env-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- Paso 1: Configurar variables útiles
      - name: Print context info
        run: |
          echo "Repo: ${{ github.event.repository.name }}"
          echo "Branch (ref): ${{ github.ref_name }}"
          echo "Branch (input): ${{ inputs.branch }}"
          echo "Commit: ${{ github.sha }}"

      # --- Paso 2: Crear y proteger la llave privada temporal
      - name: Set up SSH key
        run: |
          echo "${{ secrets.ECPAY2_EC2_TEST_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # --- Paso 3: Conectarse al servidor y ejecutar el despliegue
      - name: Deploy to EC2 (staging)
        timeout-minutes: 2
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
        run: |
          echo "==> Rama seleccionada: $BRANCH_NAME"
          
          ssh \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ConnectionAttempts=2 \
          -o ServerAliveInterval=5 \
          -o ServerAliveCountMax=2 \
          -i private_key.pem \
          ${{ secrets.ECPAY2_EC2_TEST_USER }}@${{ secrets.ECPAY2_EC2_TEST_HOST }} << EOF
          
            set -e  # Terminar el script si algo falla

            echo "==> Conectado a la máquina de pruebas AWS"

            cd ~/ecpay/ECPAY2_RD/${REPO_NAME}

            echo "==> Actualizando código desde Git..."
            git fetch origin

            git reset --hard
            git clean -fd
            
            git checkout ${BRANCH_NAME}
            
            git reset --hard origin/${BRANCH_NAME}

            echo "==> Asignando permisos de ejecución al script de despliegue..."
            chmod +x tool_deploy.sh

            echo "==> Ejecutando tool_deploy.sh..."
            ./tool_deploy.sh

            echo "==> Despliegue completado exitosamente"
          EOF

      # --- Paso 4: Limpieza de la llave privada
      - name: Clean up SSH key
        if: always()
        run: rm -f private_key.pem
